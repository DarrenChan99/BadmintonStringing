<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Palo Alto Badminton Stringing</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A4B29">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid rgba(15,107,58,0.16); border-radius:16px; padding:36px 32px; box-shadow:0 12px 32px rgba(10,75,41,0.08); }
  h1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; margin:0 0 6px; }
  .sub { font-size:14px; color:rgba(26,31,27,0.55); margin:0 0 28px; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="loginForm">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <svg width="36" height="36" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#0A4B29"/><path d="M9 21 C9 13 12.5 9 17 9 C21.5 9 25 13 25 21 Z" fill="#FAF7F0"/><rect x="8" y="20" width="18" height="3" rx="1.5" fill="#0A4B29"/><path d="M9 15 C4 13 2 8 3 4 C7 5 10 9 10.5 14 Z" fill="#FAF7F0"/><path d="M25 15 C30 13 32 8 31 4 C27 5 24 9 23.5 14 Z" fill="#FAF7F0"/></svg>
      <span class="brand-text"><span class="brand-top">PALO ALTO</span><span class="brand-sub">BADMINTON STRINGING</span></span>
    </div>
    <h1>Admin sign in</h1>
    <p class="sub">Staff access only.</p>
    <div class="error-box hidden" id="errorBox"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
    <p style="text-align:center;margin:20px 0 0;"><a href="/" style="font-size:13px;">← Back to site</a></p>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
