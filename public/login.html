<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login - Palo Alto Badminton Stringing</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A4B29">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid rgba(15,107,58,0.16); border-radius:16px; padding:36px 32px; box-shadow:0 12px 32px rgba(10,75,41,0.08); }
  h1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; margin:0 0 6px; }
  .sub { font-size:15px; color:rgba(26,31,27,0.55); margin:0 0 28px; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="loginForm">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <img src="/logo.png" width="44" height="44" alt="Palo Alto Badminton Stringing logo" style="display:block;">
      <span class="brand-text"><span class="brand-top">PALO ALTO</span><span class="brand-sub">BADMINTON STRINGING</span></span>
    </div>
    <h1>Admin sign in</h1>
    <p class="sub">Staff access only.</p>
    <div class="error-box hidden" id="errorBox"></div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
    <p style="text-align:center;margin:20px 0 0;"><a href="/" style="font-size:13px;display:inline-flex;align-items:center;gap:6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Back to site</a></p>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
